name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main, foundation-v1]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tte
          POSTGRES_USER: tte
          POSTGRES_PASSWORD: postgres_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tte -d tte"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test,postgres]'
      - name: Compile
        run: python -m compileall trading tests
      - name: Test
        env:
          POSTGRES_TEST_DSN: postgresql://tte:postgres_ci_only@127.0.0.1:5432/tte
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend indicator tests
        run: node --test tests/test_indicators.mjs
