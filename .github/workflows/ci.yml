name: CI

on:
  push:
    branches: [main, foundation-v1]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Compile
        run: python -m compileall trading tests
      - name: Test
        env:
          PYTHONPATH: .
        run: python -m pytest -q
