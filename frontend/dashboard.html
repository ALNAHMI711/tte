<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>TTE — لوحة التداول</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#07101d;color:#e8eef7}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b1424,#07101d);min-height:100vh}
    .wrap{max-width:900px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}
    h1{font-size:22px;margin:0}.sub{color:#91a0b5;font-size:12px;margin-top:4px}.badge{padding:7px 10px;border:1px solid #26364e;border-radius:999px;font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#0d1829;border:1px solid #1d2b40;border-radius:16px;padding:14px;box-shadow:0 8px 28px #0004}
    .name{font-weight:700}.status{font-size:12px;margin-top:6px;color:#8fa1b8}.ok{color:#55d88a}.wait{color:#e7c76a}.off{color:#f07f7f}.value{font-size:20px;font-weight:800;margin-top:10px}.meta{display:flex;justify-content:space-between;color:#91a0b5;font-size:11px;margin-top:8px}
    .wide{grid-column:1/-1}.notice{padding:12px;border-radius:12px;background:#111f33;border:1px solid #243753;color:#b9c7d9;font-size:12px;line-height:1.7}
    button{width:100%;margin-top:12px;border:0;border-radius:12px;padding:12px;background:#18304f;color:#fff;font-weight:700}button:active{transform:scale(.99)}
    @media(max-width:520px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><div><h1>منصة TTE للتداول</h1><div class="sub">لوحة تحكم سحابية — التداول الحقيقي مقفل افتراضياً</div></div><span id="mode" class="badge">جارٍ الفحص…</span></header>
    <section id="cards" class="grid"></section>
    <section class="card wide">
      <div class="name">جاهزية Binance</div>
      <div id="binance-readiness" class="status wait">🟡 جارٍ الفحص…</div>
      <div id="binance-readiness-detail" class="meta">حالة LIVE: مقفلة</div>
    </section>
    <section class="card wide">
      <div class="notice">🛡️ طبقة الأمان: لا يمكن للذكاء الاصطناعي أو Telegram أو الاستراتيجيات تجاوز محرك المخاطر. LIVE لا يُفعّل إلا بعد اجتياز فحوص الأمان والاتصال والصلاحيات وعنوان IP الموثوق.</div>
      <button id="logout-button" type="button">تسجيل الخروج</button>
      <div id="logout-error" class="status off" role="alert" aria-live="polite"></div>
    </section>
  </main>
<script>
function element(tag, className, text){
  const node=document.createElement(tag);
  if(className) node.className=className;
  if(text!==undefined) node.textContent=String(text);
  return node;
}

function setReadiness(text, detail, className){
  const status=document.getElementById('binance-readiness');
  status.textContent=text;
  status.className='status '+className;
  document.getElementById('binance-readiness-detail').textContent='حالة LIVE: '+detail;
}

async function loadReadiness(){
  try{
    const r=await fetch('/control/binance-readiness',{credentials:'same-origin'});
    if(r.status===401){location.href='/login.html';return}
    if(r.status===503){setReadiness('🟡 غير مكتملة','مقفلة','wait');return}
    if(!r.ok){setReadiness('⚠️ تعذر الفحص','مقفلة','off');return}
    const d=await r.json();
    setReadiness(d.ready?'🟢 جاهزة بعد اجتياز البوابات':'🟡 غير مكتملة',d.live_enabled?'مفعّلة':'مقفلة',d.ready?'ok':'wait');
  }catch(_){
    setReadiness('⚠️ تعذر الاتصال','مقفلة','off');
  }
}

async function logout(){
  const error=document.getElementById('logout-error');
  const button=document.getElementById('logout-button');
  error.textContent='';
  button.disabled=true;
  try{
    const csrf=await fetch('/csrf',{credentials:'same-origin'});
    if(!csrf.ok){throw new Error('csrf')}
    const data=await csrf.json();
    const response=await fetch('/logout',{
      method:'POST',
      credentials:'same-origin',
      headers:{'x-csrf-token':data.csrf_token}
    });
    if(!response.ok){throw new Error('logout')}
    window.location.assign('/login.html');
  }catch(_){
    button.disabled=false;
    error.textContent='تعذر تسجيل الخروج، حاول مرة أخرى.';
  }
}

document.getElementById('logout-button').addEventListener('click', logout);

function renderDashboard(d){
  const cards=document.getElementById('cards');
  cards.replaceChildren();
  for(const adapter of d.adapters||[]){
    const card=element('article','card');
    card.append(
      element('div','name',adapter.name??'—'),
      element('div','status '+(adapter.enabled?'ok':'off'),adapter.enabled?'🟢 متاح':'🔴 غير متاح'),
      element('div','value',adapter.balance??'—')
    );
    const meta=element('div','meta');
    meta.append(element('span','', 'صفقات: '+(adapter.trades??'—')),element('span','', 'PnL: '+(adapter.pnl??'—')));
    card.append(meta);
    cards.append(card);
  }
  const risk=element('article','card wide');
  risk.append(element('div','name','حدود المخاطر الحالية'));
  const rows=[
    ['مخاطرة الصفقة',(d.risk?.per_trade_pct??'—')+'%'],
    ['الخسارة اليومية',(d.risk?.daily_loss_pct??'—')+'%'],
    ['أقصى صفقات مفتوحة',d.risk?.max_open??'—'],
    ['الحد الأدنى للتقييم',d.risk?.min_score??'—']
  ];
  for(const [label,value] of rows){
    const row=element('div','meta');
    row.append(element('span','',label),element('b','',value));
    risk.append(row);
  }
  cards.append(risk);
}

async function load(){
  try{
    const r=await fetch('/dashboard/status',{credentials:'same-origin'});
    if(r.status===401){location.href='/login.html';return}
    if(!r.ok){document.getElementById('mode').textContent='⚠️ خطأ';return}
    const d=await r.json();
    document.getElementById('mode').textContent=d.mode==='PAPER'?'🟢 PAPER':'🔴 '+String(d.mode??'غير معروف');
    renderDashboard(d);
    await loadReadiness();
  }catch(_){
    document.getElementById('mode').textContent='⚠️ تعذر الاتصال';
  }
}
load();
setInterval(load,15000);
</script>
</body>
</html>
