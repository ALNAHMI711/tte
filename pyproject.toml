[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tte-trading-platform"
version = "0.1.0"
description = "Secure, paper-first trading platform foundation"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "cryptography>=42,<47",
]

[tool.setuptools.packages.find]
include = ["trading*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
